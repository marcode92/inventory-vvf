<div mat-dialog-title>CREATE MODEL</div>
<mat-dialog-content appearance="outline">
<form [formGroup]="modelloForm" class="form-container">
     <mat-form-field appearance="outline" class="margin">
            <mat-label>Nome Modello</mat-label>
            <input matInput type="text" formControlName="nomeModello" />
            <mat-error *ngIf="modelloForm.get('nomeModello')?.hasError('alreadyExists')">
                Nome già esistente
            </mat-error>
        </mat-form-field>
    <div formArrayName="fieldsModelCtrl" class="fields-grid">
        <div *ngFor="let field of fieldsModelCtrl.controls; let i = index" [formGroupName]="i" class="field-row">
            <mat-form-field appearance="outline">
                <mat-label>Nome Campo</mat-label>
                <input matInput type="text" formControlName="nome_campo" />
                <mat-error *ngIf="field.get('nome_campo')?.hasError('required')">
                    Campo obbligatorio
                </mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Tipo Campo</mat-label>
                <mat-select formControlName="tipo_campo">
                    <mat-option *ngFor="let tipo of tipi" [value]="tipo">
                        {{ tipo }}
                    </mat-option>
                </mat-select>
                 <mat-error *ngIf="field.get('tipo_campo')?.hasError('required')">
                        Campo obbligatorio
                    </mat-error>
            </mat-form-field>
            <div>
                <button mat-icon-button (click)="removeRow(i)">
                    <mat-icon> delete </mat-icon>
                </button>
            </div>
            <div *ngIf="i == fieldsModelCtrl.length - 1">
                <button mat-icon-button (click)="addRow()">
                    <mat-icon> add </mat-icon>
                </button>
            </div>
        </div>
    </div>
</form>
</mat-dialog-content>
<mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close>Annulla</button>
    <button mat-raised-button color="primary" (click)="save()">Salva</button>
</mat-dialog-actions>
