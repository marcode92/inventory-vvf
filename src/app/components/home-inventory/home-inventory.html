<mat-sidenav-container 
  class="sidenav-container" 
  [autosize] = "true"
  [hasBackdrop]="false">
  <mat-sidenav 
  mode="over" 
    [disableClose]="true"
  position ="end"
  [opened]="true"
  [class.expanded] ="menuExpanded"
  class="sidenav">
  <div class="menu-header">
    <button mat-icon-button (click)="toggleMenu()">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="menu-title" *ngIf="menuExpanded">
      Inventory vvf
    </span>
  </div>
  
  <mat-nav-list>
    <button mat-list-item class="menu-item"
    *ngFor="let item of menuItems" 
    (click)="openDialog(item.comp)">
    <div class="menu-row">
      <mat-icon>{{item.icon}}</mat-icon>
      <span *ngIf="menuExpanded"> {{item.label}} </span>
      </div>
    </button>
  </mat-nav-list>
  
  
</mat-sidenav>
<mat-sidenav-content (click)="closeMenu()">
    <mat-card class="card-container">
    <div [margin]="8" class="header-fixed">
      <div class="form-container">
        <div class="title">
          <mat-card-title>Inventario</mat-card-title>
          <mat-card-subtitle>Gestione assets</mat-card-subtitle>
        </div>
        <div class="search">
          <mat-form-field appearence="outline">
            <mat-label>Search</mat-label>
            <input matInput [formControl]="searchCtrl" />
            <button mat-icon-button matSuffix>
              <mat-icon>search</mat-icon>
            </button>
          </mat-form-field>
        </div>
      </div>
    </div>
    <mat-card-content [margin]="8">
      <div class="content-wrapper">
        <div class="table-container">
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 ">          
            
            <ng-container matColumnDef="matricola">
              <th mat-header-cell *matHeaderCellDef> Matricola </th>
              <td mat-cell *matCellDef="let element"> 
                <button mat-button color="primary" (click)="openReadItemDialog(element.matricola)">
                  {{ element.matricola }}
                </button> </td>
              </ng-container>
              
              <ng-container matColumnDef="annotazioni">
                <th mat-header-cell *matHeaderCellDef> Annotazioni </th>
                <td mat-cell *matCellDef="let element"> {{element.annotazioni}} </td>
              </ng-container>
              
              <ng-container matColumnDef="stanza">
                <th mat-header-cell *matHeaderCellDef> Stanza </th>
                <td mat-cell *matCellDef="let element"> {{element.stanza}} </td>
              </ng-container>
              
              <ng-container matColumnDef="possessori">
                <th mat-header-cell *matHeaderCellDef> Possessori </th>
                <td mat-cell *matCellDef="let element"> {{element.possessori}} </td>
              </ng-container>
              
              <ng-container matColumnDef="last_update">
                <th mat-header-cell *matHeaderCellDef> Ultimo update </th>
                <td mat-cell *matCellDef="let element"> {{element.last_update | date:'dd/MM/yyyy'}} </td>
              </ng-container>
              
              <ng-container matColumnDef="fuori_uso">
                <th mat-header-cell *matHeaderCellDef> Fuori uso </th>
                <td mat-cell *matCellDef="let element">
                  <mat-checkbox [checked]="element.fuori_uso === 'true'"></mat-checkbox>
                </td>
              </ng-container>
               <ng-container matColumnDef="delete">
                <th mat-header-cell *matHeaderCellDef> </th>
                <td mat-cell *matCellDef="let element; let i = index">
                  <button mat-icon-button (click)="removeRow(i)">
                      <mat-icon> delete </mat-icon>
                  </button>
                </td>
              </ng-container>
               <div>
            </div>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
    </mat-sidenav-content>
    </mat-sidenav-container>
