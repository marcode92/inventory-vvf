<div mat-dialog-title>UPLOAD FILE</div>

<mat-dialog-content appearance="outline" class="dialog-container">
    <input 
        #fileinput
        type="file" 
        accept=".json, application/json"
        (change)="onFileSelected($event)"
        hidden>
        <div class="display-row">
            <button mat-raised-button color="primary" (click)="fileinput.click()"> select file</button>
            <div *ngIf="selectedFile">File selected: {{selectedFile?.name}}</div>
        </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Annulla</button>
    <button mat-raised-button color="primary" 
    [disabled]="!selectedFile" 
    (click)="addItem()">ADD ITEM</button>
</mat-dialog-actions>
