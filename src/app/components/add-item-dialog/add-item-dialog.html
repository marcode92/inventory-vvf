<div mat-dialog-title>SELECT MODEL</div>

<!-- <mat-dialog-content >

</mat-dialog-content> -->
<mat-dialog-content appearance="outline">
    <div>
            <mat-form-field appearance="outline">
                <mat-label>Tipo item</mat-label>
                <mat-select [formControl]="modelFormCtrl">
                    <mat-option *ngFor="let tipo of listModelsName" [value]="tipo">
                        {{ tipo }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    
    <button mat-button mat-dialog-close>Annulla</button>
    <button mat-raised-button color="primary" (click) = "search()" >OK</button>
</mat-dialog-actions>
