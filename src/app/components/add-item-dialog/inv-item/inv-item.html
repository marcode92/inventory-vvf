<form [formGroup]="addItemForm" class="form-container">
    <h3> INVENTORY FIELDS </h3>
    <div class="fields-grid">
        <mat-form-field appearance="outline">
            <mat-label>Cat tipo</mat-label>
            <input matInput type="text" formControlName="cat_tipo" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Num Inv</mat-label>
            <input matInput type="text" formControlName="num_inv" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Sec pdci</mat-label>
            <input matInput type="text" formControlName="sec_pdci" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Denominazione</mat-label>
            <input matInput type="text" formControlName="denominazione" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Matricola</mat-label>
            <input matInput type="text" formControlName="matricola" />
            <mat-error *ngIf="addItemForm.get('matricola')?.hasError('alreadyExists')">
                Matricola già esistente
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Annotazioni</mat-label>
            <input matInput type="text" formControlName="annotazioni" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Stanza</mat-label>
            <input matInput type="text" formControlName="stanza" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Possessori</mat-label>
            <input matInput type="text" formControlName="possessori" />
        </mat-form-field>
        <mat-slide-toggle formControlName="out_of_service">
            Fuori uso
        </mat-slide-toggle>
    </div>
    <mat-divider></mat-divider>
    <h3>CUSTOM FIELDS</h3>

                <mat-label>{{ field.nome_campo }}</mat-label>

            </mat-form-field>

            <mat-form-field *ngIf="field.tipo_campo === 'Alfanumerico'" appearance="outline">
                <mat-label>{{ field.nome_campo }}</mat-label>
                <input matInput type="text" [formControlName]="i">
            </mat-form-field>

            <mat-slide-toggle *ngIf="field.tipo_campo == 'Decisionale'" appearance="outline" [formControlName]="i">
                {{ field.nome_campo }}
            </mat-slide-toggle>
        </ng-container>
    </div> -->
    <div formArrayName="fieldsEmptyCtrl" class="fields-grid">
        <ng-container *ngFor="let field of fieldsEmptyCtrl.controls; let i = index" [formGroupName]="i"
            class="field-row">
            <mat-form-field appearance="outline">
                <mat-label>Nome Campo</mat-label>
                <input matInput type="text" formControlName="nome_campo" />
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Tipo Campo</mat-label>
                <mat-select formControlName="tipo_campo">
                    <mat-option *ngFor="let tipo of tipi" [value]="tipo">
                        {{ tipo }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <div *ngIf="field.get('tipo_campo')?.value === TipoCampo.NUME">
                <mat-form-field appearance="outline">
                    <mat-label>Valore</mat-label>
                    <input matInput type="number" formControlName="valore" />
                </mat-form-field>
            </div>
            <div *ngIf="field.get('tipo_campo')?.value === TipoCampo.ALFA">
                <mat-form-field appearance="outline">
                    <mat-label>Valore</mat-label>
                    <input matInput type="text" formControlName="valore" />
                </mat-form-field>
            </div>
            <div *ngIf="field.get('tipo_campo')?.value === TipoCampo.BOOL" class="switch-container">
                <label>Obbligatorio</label>
                <mat-slide-toggle formControlName="mandatory"></mat-slide-toggle>
            </div>
            <div>
                <button mat-icon-button (click)="removeRow(i)">
                    <mat-icon> delete </mat-icon>
                </button>
            </div>
            <div *ngIf="i == fieldsEmptyCtrl.length - 1">
                <button mat-icon-button (click)="addRow()">
                    <mat-icon> add </mat-icon>
                </button>
            </div>
        </ng-container>
    </div>
</form>
