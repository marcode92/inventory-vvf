<h2 mat-dialog-title>INVENTORY FIELDS UPDATE</h2>
<mat-dialog-content>        
<inv-item *ngIf="select"
        [assetRef]="formRef" 
        (itemToSave)="updateItem($event)"></inv-item>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Annulla</button>
    <button mat-raised-button color="primary" (click)="save()">OK</button>
</mat-dialog-actions>
